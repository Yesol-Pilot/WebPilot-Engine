name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: 🏗️ Build & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          lfs: false  # GLB 파일은 빌드에 불필요

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: npm ci --ignore-scripts
        env:
          SKIP_PRISMA_GENERATE: true

      - name: 🔍 TypeScript Check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: 🧹 Lint
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_PRISMA_GENERATE: true
          NEXT_TELEMETRY_DISABLED: 1

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🧪 Run Tests
        run: npm run test
        continue-on-error: true
