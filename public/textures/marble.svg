<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <pattern id="veins" patternUnits="userSpaceOnUse" width="100" height="100">
   <path d="M0 50 Q25 30 50 50 T100 50" stroke="#ccc" stroke-width="2" fill="none" opacity="0.3"/>
   <path d="M20 0 Q40 25 20 50 T20 100" stroke="#ddd" stroke-width="1" fill="none" opacity="0.2"/>
  </pattern>
  <filter id="noise">
   <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" stitchTiles="stitch"/>
   <feColorMatrix type="saturate" values="0.1"/>
  </filter>
 </defs>
 <rect width="512" height="512" fill="#f0ebe5"/>
 <rect width="512" height="512" fill="url(#veins)"/>
 <rect width="512" height="512" filter="url(#noise)" opacity="0.2"/>
</svg>
