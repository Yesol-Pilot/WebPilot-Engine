<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#a8a8a8"/>
   <stop offset="50%" style="stop-color:#d0d0d0"/>
   <stop offset="100%" style="stop-color:#909090"/>
  </linearGradient>
  <filter id="noise">
   <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
   <feColorMatrix type="saturate" values="0"/>
  </filter>
 </defs>
 <rect width="512" height="512" fill="url(#metalGrad)"/>
 <rect width="512" height="512" filter="url(#noise)" opacity="0.15"/>
 <line x1="0" y1="128" x2="512" y2="128" stroke="#bbb" stroke-width="1"/>
 <line x1="0" y1="256" x2="512" y2="256" stroke="#bbb" stroke-width="1"/>
 <line x1="0" y1="384" x2="512" y2="384" stroke="#bbb" stroke-width="1"/>
</svg>
